; Copy into an existing dedicated DUT profile outside the repository.
; No workloads run until a remote DUT is configured and dedicated_dut=1.
[global]
platform=Windows
local_execution=0
dut_ip=
tools=run_report
collection_enabled=1
training_mode=0
iterations=1
attempts=1

[enterprise_ai]
dedicated_dut=0
condition=A
protocol=indexing
measurement_seconds=1800
settle_seconds=10
stress_workers=1
stress_duty_cycle=0.25
corpus_dir=
semantic_ready_value=
configure_utc=0
validation_mode=capture
required_pts=8805 8806 8807
background_timers=1
background_teams=1
simple_office_launch=1
file_explorer=1
snipping_tool=1
settings_app=1

[enterprise_ai_metrics]
trace_validator=
